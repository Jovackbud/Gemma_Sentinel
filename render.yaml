services:
  - type: web
    name: gemma-sentinel
    runtime: python
    buildCommand: ""
    startCommand: python server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: MODEL_ENGINE
        value: auto
      - key: LLAMACPP_ENABLED
        value: "0"
      - key: GOOGLE_API_KEY
        sync: false
